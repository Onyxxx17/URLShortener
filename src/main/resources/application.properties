spring.application.name=urlshortener

spring.config.import=optional:file:.env[.properties]

# Hibernate — auto-manages schema in dev (update adds missing columns/tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# HTTP request logging
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.com.ayth.urlshortener.email=DEBUG
logging.level.com.ayth.urlshortener.url=DEBUG

## Flyway — disabled; Hibernate ddl-auto=update handles schema in dev
spring.flyway.enabled=false

spring.datasource.url=jdbc:postgresql://localhost:5432/url_shortener
spring.datasource.username=postgres
# spring.datasource.password supplied by .env (gitignored) — see .env.example

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# JWT
# jwt.secret supplied by .env (gitignored) — see .env.example. Generate with:
# openssl rand -base64 32
jwt.expiration-ms=900000

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# spring.mail.username / spring.mail.password supplied by .env (gitignored)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

app.base-url=http://localhost:8080

app.frontend-url=http://localhost:5173

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.cookie.same-site=Lax

server.forward-headers-strategy=native