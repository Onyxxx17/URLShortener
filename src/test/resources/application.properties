# ── Test profile: swaps Postgres + Redis for in-memory equivalents ──────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for tests (schema managed by Hibernate)
spring.flyway.enabled=false

# Redis auto-configuration is left ON: RedisConfig.stringRedisTemplate needs a
# RedisConnectionFactory bean to exist. Lettuce creates its connection lazily,
# so the context loads without a Redis server running. Service-layer unit tests
# mock StringRedisTemplate directly and never touch this.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT (must be a valid Base64-encoded key of at least 256 bits)
jwt.secret=dGhpcyBpcyBhIHZlcnkgc2VjcmV0IGp3dCBzaWduaW5nIGtleQ==
jwt.expiration-ms=900000

# Mail is NOT excluded: EmailService requires a JavaMailSender bean to exist.
# Pointing at a dead local host is enough — the context wires up, and nothing
# connects unless a send is actually invoked.
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=test

# Consumed by EmailService for building verification / reset links
app.base-url=http://localhost:8080

# Silence noisy logging
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN
logging.level.com.ayth=WARN
